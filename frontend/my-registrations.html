<!DOCTYPE html>
<html lang="en">
<head>
  <title>My registrations · CivicEvents</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-api.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-900" data-page="my-registrations">
  <script>Auth.requireLogin(); // ROLE GUARD: any logged-in user sees only THEIR registrations</script>
  <main id="main" class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">
    <h1 class="text-3xl font-bold">My registrations</h1>
    <p class="mt-1 text-slate-600">Events you've signed up for.</p>

    <div class="mt-6 flex gap-2" role="tablist" aria-label="Filter registrations">
      <button type="button" role="tab" data-tab="upcoming" aria-selected="true" class="tab rounded-lg px-4 py-2 text-sm font-semibold">Upcoming</button>
      <button type="button" role="tab" data-tab="past" aria-selected="false" class="tab rounded-lg px-4 py-2 text-sm font-semibold">Past</button>
      <button type="button" role="tab" data-tab="cancelled" aria-selected="false" class="tab rounded-lg px-4 py-2 text-sm font-semibold">Cancelled</button>
    </div>

    <ul id="regs" class="mt-4 space-y-3" aria-live="polite"></ul>
  </main>
  <script src="js/pages/my-registrations.js"></script>
</body>
</html>
