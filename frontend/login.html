<!DOCTYPE html>
<html lang="en">
<head>
  <title>Log in · CivicEvents</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <script>Auth.redirectIfLoggedIn(); // GUARD: logged-in users don't need the login page</script>
  <main id="main" class="flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="mb-6 text-center">
        <span class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-blue-700 text-lg font-extrabold text-white" aria-hidden="true">CE</span>
        <h1 class="mt-3 text-2xl font-bold">Welcome back to CivicEvents</h1>
        <p class="text-slate-600">Log in to see events, announcements and more.</p>
      </div>

      <form id="login-form" class="space-y-5 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8" novalidate>
        <div>
          <label for="email" class="block font-medium">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <div>
          <label for="password" class="block font-medium">Password</label>
          <div class="relative mt-1">
            <input id="password" name="password" type="password" autocomplete="current-password" required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-16 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
            <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 px-3 text-sm font-medium text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-600 rounded-r-lg" aria-controls="password" aria-pressed="false">Show</button>
          </div>
        </div>
        <label class="flex items-center gap-2 text-slate-700">
          <input id="remember" type="checkbox" class="h-4 w-4 rounded border-slate-400 text-blue-700 focus:ring-blue-600">
          Keep me signed in on this device
        </label>
        <p id="form-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800 ring-1 ring-red-200" role="alert"></p>
        <button id="submit-btn" type="submit" class="w-full rounded-lg bg-blue-700 py-2.5 font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 disabled:opacity-70">Log in</button>
        <p class="text-center text-sm text-slate-600">New here? <a href="signup.html" class="font-medium text-blue-700 underline hover:text-blue-900">Create an account</a></p>
      </form>
    </div>
  </main>

<script>
$(function () {
  UI.showFlash();

  $('#toggle-pw').on('click', function () {
    const show = $('#password').attr('type') === 'password';
    $('#password').attr('type', show ? 'text' : 'password');
    $(this).text(show ? 'Hide' : 'Show').attr('aria-pressed', show);
  });

  $('#login-form').on('submit', function (e) {
    e.preventDefault();
    $('#form-error').addClass('hidden');
    const email = $('#email').val().trim();
    const password = $('#password').val();

    // client-side validation
    let ok = true;
    UI.fieldError('#email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? '' : 'Enter a valid email address.');
    UI.fieldError('#password', password ? '' : 'Enter your password.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !password) ok = false;
    if (!ok) { $('[aria-invalid=true]').first().trigger('focus'); return; }

    UI.setLoading('#submit-btn', true, 'Logging in…');
    API.post('/api/auth/login', { email, password }, { silent: true })
      .done(res => {
        const { token, user } = res.data;
        Auth.save(token, user, $('#remember').is(':checked'));
        // The API lets disabled accounts log in, so check is_active and stop them here
        API.get('/api/users/profile/me', { silent: true }).done(p => {
          if (p.data && p.data.is_active === false) {
            Auth.clear();
            $('#form-error').text('Your account has been disabled. Please contact an administrator.').removeClass('hidden');
            UI.setLoading('#submit-btn', false);
            return;
          }
          UI.flash('Welcome back, ' + (user.full_name || '') + '!');
          window.location.href = Auth.homePage();
        }).fail(() => { UI.flash('Welcome back, ' + (user.full_name || '') + '!'); window.location.href = Auth.homePage(); });
      })
      .fail(xhr => {
        $('#form-error').text(xhr.status === 401 ? 'Incorrect email or password.' : xhr.friendlyMessage).removeClass('hidden');
        UI.setLoading('#submit-btn', false);
      });
  });
});
</script>
</body>
</html>
