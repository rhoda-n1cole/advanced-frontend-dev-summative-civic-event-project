<!DOCTYPE html>
<html lang="en">
<head>
  <title>Event · CivicEvents</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-api.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-900" data-page="events">
  <script>Auth.requireLogin(); // ROLE GUARD: any logged-in user</script>

  <main id="main" class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">
    <a href="events.html" class="inline-flex items-center gap-1 rounded text-sm font-medium text-blue-700 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-600">← All events</a>
    <div id="event" class="mt-4" aria-live="polite">
      <div class="animate-pulse space-y-4" aria-hidden="true">
        <div class="h-72 rounded-2xl bg-slate-200"></div>
        <div class="h-8 w-2/3 rounded bg-slate-200"></div>
        <div class="h-4 w-1/3 rounded bg-slate-200"></div>
        <div class="h-24 rounded bg-slate-200"></div>
      </div>
    </div>

    <!-- ROLE GUARD (UI): registrants list is admin only -->
    <section id="attendees-section" data-admin-only class="hidden mt-8 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200" aria-labelledby="attendees-title">
      <div class="flex items-center justify-between">
        <h2 id="attendees-title" class="text-xl font-bold">Registrants</h2>
        <span id="attendee-count" class="rounded-full bg-blue-100 px-3 py-1 text-sm font-semibold text-blue-800"></span>
      </div>
      <div id="attendees" class="mt-4"></div>
    </section>

    <section id="feedback-section" class="mt-8 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200" aria-labelledby="feedback-title">
      <h2 id="feedback-title" class="text-xl font-bold">Feedback</h2>
      <div id="rating-summary" class="mt-3"></div>

      <!-- Normal users: add / edit their single feedback -->
      <div data-user-only class="hidden">
        <div id="my-feedback" class="mt-4"></div>
        <form id="feedback-form" class="mt-4 hidden space-y-4" novalidate>
          <fieldset>
            <legend class="font-medium">Your rating</legend>
            <div class="mt-2 flex gap-1" id="star-input" role="radiogroup" aria-label="Rating from 1 to 5 stars">
              <!-- filled by JS -->
            </div>
          </fieldset>
          <div>
            <label for="fb-comment" class="block font-medium">Comment <span class="font-normal text-slate-500">(optional)</span></label>
            <textarea id="fb-comment" rows="3" maxlength="1000" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="What did you think of this event?"></textarea>
          </div>
          <div class="flex gap-2">
            <button id="fb-submit" type="submit" class="rounded-lg bg-blue-700 px-4 py-2 font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2">Submit feedback</button>
            <button id="fb-cancel" type="button" class="hidden rounded-lg px-4 py-2 font-semibold text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Admins: every feedback entry -->
      <ul id="feedback-list" data-admin-only class="hidden mt-6 divide-y divide-slate-100"></ul>
    </section>
  </main>

  <script src="js/pages/event.js"></script>
</body>
</html>
