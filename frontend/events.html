<!DOCTYPE html>
<html lang="en">
<head>
  <title>Events · CivicEvents</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-api.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-900" data-page="events">
  <script>Auth.requireLogin(); // ROLE GUARD: any logged-in user can browse events</script>

  <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold">Events</h1>
        <p class="mt-1 text-slate-600">Find city events near you and save your spot.</p>
      </div>
      <!-- ROLE GUARD (UI): only admins see the create button -->
      <a href="event-form.html" data-admin-only class="hidden rounded-lg bg-blue-700 px-4 py-2.5 font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2">+ Create event</a>
    </div>

    <!-- Filters -->
    <form id="filters" class="mt-6 grid gap-3 rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200 sm:grid-cols-2 lg:grid-cols-5" role="search" aria-label="Filter events">
      <div class="lg:col-span-2">
        <label for="f-search" class="block text-sm font-medium text-slate-700">Search</label>
        <input id="f-search" type="search" placeholder="Title, description or place"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div>
        <label for="f-when" class="block text-sm font-medium text-slate-700">When</label>
        <select id="f-when" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
          <option value="upcoming">Upcoming</option>
          <option value="week">Next 7 days</option>
          <option value="month">Next 30 days</option>
          <option value="past">Past events</option>
          <option value="all">All dates</option>
          <option value="date">Pick a date…</option>
        </select>
      </div>
      <div id="f-date-wrap" class="hidden">
        <label for="f-date" class="block text-sm font-medium text-slate-700">Date</label>
        <input id="f-date" type="date" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div>
        <label for="f-location" class="block text-sm font-medium text-slate-700">Location</label>
        <select id="f-location" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
          <option value="">All locations</option>
        </select>
      </div>
      <div data-admin-only class="hidden">
        <label for="f-status" class="block text-sm font-medium text-slate-700">Status</label>
        <select id="f-status" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
          <option value="">All</option>
          <option value="published">Published</option>
          <option value="draft">Unpublished</option>
        </select>
      </div>
    </form>

    <div class="mt-4 flex items-center justify-between">
      <p id="result-count" class="text-sm text-slate-600" aria-live="polite"></p>
      <button id="clear-filters" type="button" class="hidden text-sm font-medium text-blue-700 underline hover:text-blue-900">Clear filters</button>
    </div>

    <div id="events-grid" class="mt-3 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-busy="true"></div>

    <nav id="pagination" class="mt-8 flex flex-wrap items-center justify-center gap-2" aria-label="Pagination"></nav>
  </main>

  <script src="js/pages/events.js"></script>
</body>
</html>
