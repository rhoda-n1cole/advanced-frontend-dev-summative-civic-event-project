<!DOCTYPE html>
<html lang="en">
<head>
  <title>My dashboard · CivicEvents</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/media-api.js"></script>
  <script src="js/events-api.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-900" data-page="my-dashboard">
  <script>
    Auth.requireLogin(); // ROLE GUARD: logged-in users
    if (Auth.isAdmin()) window.location.replace('admin-dashboard.html'); // admins have their own dashboard
  </script>
  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8">
    <h1 class="text-3xl font-bold">Hi, <span id="first-name"></span> 👋</h1>
    <p class="mt-1 text-slate-600">Here's what's happening in your city.</p>

    <section aria-label="Your activity" id="stats" class="mt-6 grid grid-cols-2 gap-4 md:grid-cols-4"></section>

    <div class="mt-6 grid gap-6 lg:grid-cols-3">
      <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 lg:col-span-2" aria-labelledby="up-title">
        <div class="flex items-center justify-between">
          <h2 id="up-title" class="text-lg font-bold">Your upcoming events</h2>
          <a href="my-registrations.html" class="text-sm font-semibold text-blue-700 hover:underline">My registrations →</a>
        </div>
        <ul id="upcoming" class="mt-4 divide-y divide-slate-100"></ul>
      </section>
      <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200" aria-labelledby="ann-title">
        <div class="flex items-center justify-between">
          <h2 id="ann-title" class="text-lg font-bold">Latest announcements</h2>
          <a href="announcements.html" class="text-sm font-semibold text-blue-700 hover:underline">All →</a>
        </div>
        <ul id="latest-ann" class="mt-4 divide-y divide-slate-100"></ul>
      </section>
    </div>

    <section class="mt-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200" aria-labelledby="disc-title">
      <div class="flex items-center justify-between">
        <h2 id="disc-title" class="text-lg font-bold">Discover events</h2>
        <a href="events.html" class="text-sm font-semibold text-blue-700 hover:underline">Browse all →</a>
      </div>
      <ul id="discover" class="mt-4 grid gap-4 sm:grid-cols-3"></ul>
    </section>
  </main>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
