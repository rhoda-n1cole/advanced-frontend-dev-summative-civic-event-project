<!DOCTYPE html>
<html lang="en">
<head>
  <title>Event form · CivicEvents</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events-api.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-900" data-page="events">
  <script>Auth.requireAdmin(); // ROLE GUARD: ADMIN ONLY – normal users are redirected to forbidden.html</script>

  <main id="main" class="mx-auto w-full max-w-3xl flex-1 px-4 py-8">
    <a href="events.html" class="inline-flex items-center gap-1 rounded text-sm font-medium text-blue-700 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-600">← Back to events</a>
    <h1 id="form-title" class="mt-3 text-3xl font-bold">Create event</h1>

    <form id="event-form" class="mt-6 space-y-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8" novalidate>
      <div>
        <label for="title" class="block font-medium">Title <span class="text-red-700" aria-hidden="true">*</span></label>
        <input id="title" name="title" type="text" required maxlength="200"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div>
        <label for="description" class="block font-medium">Description</label>
        <textarea id="description" name="description" rows="5"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
      </div>
      <div>
        <label for="location" class="block font-medium">Location <span class="text-red-700" aria-hidden="true">*</span></label>
        <input id="location" name="location" type="text" required placeholder="e.g. City Hall, 1 Main Street"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label for="starts_at" class="block font-medium">Starts <span class="text-red-700" aria-hidden="true">*</span></label>
          <input id="starts_at" type="datetime-local" required
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <div>
          <label for="ends_at" class="block font-medium">Ends <span class="text-red-700" aria-hidden="true">*</span></label>
          <input id="ends_at" type="datetime-local" required
            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
      </div>

      <div>
        <span class="block font-medium" id="image-label">Event image</span>
        <p class="text-sm text-slate-600" id="image-help">JPG, PNG or GIF, up to 2 MB.</p>
        <div class="mt-2 flex flex-col gap-4 sm:flex-row sm:items-start">
          <img id="preview" alt="Preview of the selected event image" class="hidden h-40 w-full rounded-xl bg-slate-100 object-cover ring-1 ring-slate-200 sm:w-64">
          <div class="flex-1">
            <label for="image" class="flex cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 px-4 py-6 text-center hover:border-blue-600 hover:bg-blue-50 focus-within:ring-2 focus-within:ring-blue-600">
              <span class="text-3xl" aria-hidden="true">🖼️</span>
              <span class="mt-1 font-semibold text-blue-700">Choose an image</span>
              <span id="file-name" class="mt-1 text-sm text-slate-600">No file chosen</span>
              <input id="image" name="image" type="file" accept=".jpg,.jpeg,.png,.gif,image/jpeg,image/png,image/gif" class="sr-only" aria-describedby="image-help">
            </label>
            <button id="clear-image" type="button" class="mt-2 hidden text-sm font-medium text-red-700 underline">Remove selected image</button>
          </div>
        </div>
      </div>

      <div class="flex items-start gap-3 rounded-xl bg-slate-50 p-4">
        <input id="published" type="checkbox" checked class="mt-1 h-5 w-5 rounded border-slate-400 text-blue-700 focus:ring-blue-600" aria-describedby="published-help">
        <div>
          <label for="published" class="font-medium">Published</label>
          <p id="published-help" class="text-sm text-slate-600">Published events are visible to all residents. (The current API publishes every event, so this is always on.)</p>
        </div>
      </div>

      <div id="progress-wrap" class="hidden">
        <div class="flex justify-between text-sm"><span>Uploading…</span><span id="progress-text">0%</span></div>
        <div class="mt-1 h-2 overflow-hidden rounded-full bg-slate-200" role="progressbar" aria-label="Upload progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div id="progress-fill" class="h-full w-0 bg-blue-700 transition-all"></div>
        </div>
      </div>

      <p id="form-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800 ring-1 ring-red-200" role="alert"></p>

      <div class="flex flex-wrap justify-end gap-3 border-t border-slate-100 pt-6">
        <a href="events.html" class="rounded-lg px-5 py-2.5 font-semibold text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-600">Cancel</a>
        <button id="submit-btn" type="submit" class="rounded-lg bg-blue-700 px-5 py-2.5 font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 disabled:opacity-70">Create event</button>
      </div>
    </form>
  </main>

  <script src="js/pages/event-form.js"></script>
</body>
</html>
