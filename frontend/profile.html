<!DOCTYPE html>
<html lang="en">
<head>
  <title>My profile · CivicEvents</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 text-slate-900" data-page="profile">
  <script>Auth.requireLogin(); // ROLE GUARD: any logged-in user, own profile only</script>
  <main id="main" class="mx-auto w-full max-w-4xl flex-1 px-4 py-8">
    <h1 class="text-3xl font-bold">My profile</h1>

    <div class="mt-6 grid gap-6 md:grid-cols-3">
      <section class="rounded-2xl bg-white p-6 text-center shadow-sm ring-1 ring-slate-200" aria-labelledby="who">
        <div id="avatar" class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-blue-700 text-2xl font-bold text-white" aria-hidden="true">?</div>
        <h2 id="who" class="mt-3 text-xl font-bold">…</h2>
        <p id="who-email" class="text-slate-600"></p>
        <div class="mt-3 flex flex-wrap justify-center gap-2" id="badges"></div>
        <dl id="my-stats" class="mt-6 grid grid-cols-2 gap-3 text-left"></dl>
      </section>

      <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 md:col-span-2" aria-labelledby="edit-title">
        <h2 id="edit-title" class="text-lg font-bold">Account details</h2>
        <form id="profile-form" class="mt-4 space-y-5" novalidate>
          <div>
            <label for="full_name" class="block font-medium">Full name</label>
            <input id="full_name" type="text" autocomplete="name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
          </div>
          <div>
            <label for="email" class="block font-medium">Email</label>
            <input id="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600">
          </div>
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="role" class="block font-medium">Role</label>
              <input id="role" type="text" disabled aria-describedby="locked-help" class="mt-1 w-full cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 capitalize text-slate-600">
            </div>
            <div>
              <label for="status" class="block font-medium">Account status</label>
              <input id="status" type="text" disabled aria-describedby="locked-help" class="mt-1 w-full cursor-not-allowed rounded-lg border border-slate-200 bg-slate-100 px-3 py-2 text-slate-600">
            </div>
          </div>
          <p id="locked-help" class="text-sm text-slate-600">🔒 Role and status can only be changed by an administrator.</p>
          <p id="form-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800 ring-1 ring-red-200" role="alert"></p>
          <div class="flex justify-end gap-3 border-t border-slate-100 pt-5">
            <button id="reset-btn" type="button" class="rounded-lg px-5 py-2.5 font-semibold text-slate-700 ring-1 ring-slate-300 hover:bg-slate-50">Undo changes</button>
            <button id="save-btn" type="submit" disabled class="rounded-lg bg-blue-700 px-5 py-2.5 font-semibold text-white hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">Save changes</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <script src="js/pages/profile.js"></script>
</body>
</html>
